name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python ${{ matrix.python-version }} (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile source and tests
        run: python -m compileall -q hooks scripts tests
      - name: Run gate decision matrix
        run: python tests/test_gate.py
      - name: Install into a throwaway HOME and verify the installed gate
        run: |
          export HOME="$(mktemp -d)"
          python scripts/pin_hook.py --no-verify
          test -f "$HOME/.gemini/config/engagements/programs/example-program.md"
          BTG_GATE="$HOME/.gemini/config/hooks/scope_gate_v2.py" python tests/test_gate.py
      - name: Run parser unit tests
        run: python -m unittest discover -s tests -v
      - name: Verify the gate keeps its pinned name
        run: python scripts/pin_hook.py --check

  windows-verification:
    name: Windows PowerShell verification
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Run gate regression tests
        run: python tests/test_gate.py
      - name: Run PowerShell smoke verification (PowerShell 7)
        shell: pwsh
        run: ./scripts/verify.ps1
      # windows-latest ships Windows PowerShell 5.1, which pipes strings into a
      # native command as UTF-8 *with* a BOM. Without a gate that strips it, the
      # JSON parse fails, the gate fails open, and every decision is "allow" --
      # a green run of this step is what says that path is covered.
      - name: Run PowerShell smoke verification (Windows PowerShell 5.1)
        shell: powershell
        run: ./scripts/verify.ps1
  release:
    name: Publish tagged GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [python-tests, windows-verification]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Package source and checksum
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          git archive --format=zip --prefix="BTGoogle-${RELEASE_TAG}/" --output="dist/BTGoogle-${RELEASE_TAG}.zip" HEAD
          sha256sum "dist/BTGoogle-${RELEASE_TAG}.zip" > "dist/BTGoogle-${RELEASE_TAG}.zip.sha256"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" "dist/BTGoogle-${RELEASE_TAG}.zip" "dist/BTGoogle-${RELEASE_TAG}.zip.sha256" --title "$RELEASE_TAG" --generate-notes
